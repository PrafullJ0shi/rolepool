# Daily sweep, data commit, opt-in alerts and GitHub Pages deploy.
# The box token cannot push workflow files, so add this file through the GitHub web UI
# (Add file -> Create new file -> .github/workflows/sweep.yml), then set
# Settings -> Pages -> Source to "GitHub Actions". A copy lives in docs/github-workflow-sweep.yml.
name: Daily sweep

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "site/**"
      - "data/companies.yml"
      - "requirements.txt"
      - ".github/workflows/sweep.yml"
      - "!site/data/**"
      - "!site/feed/**"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: role-tape-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scheduled: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (no network)
        run: python -m pytest

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .http-cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Sweep
        run: python -m app.sweep

      - name: Commit data
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "Prafull Joshi"
          git config user.email "prafulljoshi92@gmail.com"
          git add data site/data site/feed
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Daily sweep $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase -X theirs "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push data; Pages still deploys this run's site/."

      - name: Post opt-in alerts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m app.alerts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
